[tool.poetry]
name = "CxKitty"
version = "0.4.5"
description = "超星学习通答题姬. 媒体播放、章节测验、课程考试, 集成式自动化工具"
license = "GPL-3.0"
authors = ["SocialSisterYi <1440239038@qq.com>"]
readme = "README.md"
repository = "https://github.com/SocialSisterYi/CxKitty"
package-mode = false


[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[tool.poetry.dependencies]
python = ">=3.10,<3.14"
requests = "^2.28.1"
qrcode = "^7.3.1"
rich = "^12.6.0"
pycryptodome = ">=3.15.0"
lxml = ">=4.9.1"
pyyaml = ">=6.0.1"
jsonpath-python = "^1.0.6"
beautifulsoup4 = "^4.11.1"
ddddocr = ">=1.4.10"
# onnxruntime 1.24 起不再提供 Python 3.10 的 wheel, 为兼容 3.10 在此限制上界
onnxruntime = ">=1.16.3,<1.24"
numpy = ">=1.24.3"
opencv-python = ">=4.7.0.72"
dataclasses-json = ">=0.5.7"
yarl = ">=1.9.2"
openai = "^1.14.3"
# 配置编辑器用其读写 config.yml, 以保留注释与格式
"ruamel.yaml" = "^0.18.5"


[tool.poetry.group.dev.dependencies]
black = "^22.12.0"
isort = "^5.12.0"

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
